name: Build Pure Watch Collector

on:
  push:
    branches: [pure-watch-collector-build]
    paths:
      - 'pure-watch-collector/**'
      - '.github/workflows/build-collector.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: pure-watch-collector
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pure-watch-collector-apk
          path: pure-watch-collector/app/build/outputs/apk/debug/app-debug.apk
